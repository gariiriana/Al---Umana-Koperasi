name = "al-umana-invoice-api"
account_id = "42957b053de047bdb5d17c57be5bda9b"
main = "worker.js"
compatibility_date = "2026-09-22"
# Jangan hapus variabel yang mungkin ditambahkan lewat dashboard saat deploy.
keep_vars = true
routes = [
  { pattern = "koperasi-alumana.com/api/public/invoices/*", zone_name = "koperasi-alumana.com" },
  { pattern = "koperasi-alumana.com/api/orders", zone_name = "koperasi-alumana.com" }
]

# Simpan log Worker (dashboard Cloudflare → Workers → al-umana-invoice-api → Logs).
[observability]
enabled = true

[vars]
FIREBASE_PROJECT_ID = "al-umana-koperasi"
ALLOWED_ORIGIN = "https://koperasi-alumana.com"

# Set FIREBASE_PROJECT_ID and ALLOWED_ORIGIN in the Worker dashboard as plain
# variables. Add FIREBASE_CLIENT_EMAIL and FIREBASE_PRIVATE_KEY as encrypted
# secrets; never add them to this file or the repository.

# Request limits (rate-limit.js). Counted per Cloudflare location, 60-second window.
# Public invoice lookups, per visitor address: each one costs a Firestore read.
[[ratelimits]]
name = "INVOICE_LIMITER"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

# Checkout attempts, per signed-in account.
[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "2002"
simple = { limit = 6, period = 60 }
