name = "al-umana-toksan"
account_id = "42957b053de047bdb5d17c57be5bda9b"
main = "src/worker.js"
compatibility_date = "2026-09-22"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "koperasi-alumana.com/api/toksan/*", zone_name = "koperasi-alumana.com" }
]

[observability]
enabled = true

[vars]
FIREBASE_PROJECT_ID = "al-umana-koperasi"
ALLOWED_ORIGIN = "https://koperasi-alumana.com"

[[d1_databases]]
binding = "DB"
database_name = "toksan"
database_id = "62999ce0-9e23-49fc-b9df-b6d4e0c54016"
migrations_dir = "migrations"

# Encrypted secrets (never in this file or the repository), same service account as absensi:
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL
#   npx wrangler secret put FIREBASE_PRIVATE_KEY
